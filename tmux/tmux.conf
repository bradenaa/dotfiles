# Appended to the config home-manager generates (see home/tmux.nix), which
# sets the prefix, indexes, vi keys, mouse and terminal, and loads the plugins
# after this file. Edits need `home-manager switch`.

# Plugin options (must be set before the plugins load)
set -g @shell_mode 'vi'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# True color + undercurl in terminals that support it (nvim relies on these).
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on
set-option -g set-titles-string '[#S:#I #h] #W'

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# Copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Split panes with prefix-v / prefix-s, keeping the current directory
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Swap windows left and right via: prefix -> shift-n(N) or prefix -> shift-p (P)
bind-key N swap-window -t +1 \; next-window
bind-key P swap-window -t -1 \; previous-window

# Status bar
set -g pane-border-style bg=default,fg=colour235
set -g status-interval 2
set -g status-justify left
set -g status-style bg=default,fg=default
set -g window-status-style fg=colour8
setw -g window-status-current-style fg=colour225,bg=blue
set -g status-right-length 200
set -g status-left-length 50
# #{prefix_highlight} is filled in by the prefix-highlight plugin, and
# continuum adds its autosave hook here, so plugins must load after this.
set -g status-right "#{prefix_highlight} #{s|$HOME|~|:pane_current_path} - %a %d %b %H:%M"
