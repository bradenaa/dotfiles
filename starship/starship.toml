add_newline = false

format = """
[$username](yellow)\
[@](cyan)\
[$hostname](green)\
$directory\
$git_branch\
$git_status\
$character
"""

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[username]
show_always = true
disabled = false
format = "[$user]($style)"

[hostname]
ssh_only = false
format = "[$hostname]($style) "

[directory]
style = "blue"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "yellow"
conflicted = "⚠ "
modified = "✚ "
staged = "● "
untracked = "… "

[cmd_duration]
min_time = 500
format = " took [$duration](dimmed white)"

